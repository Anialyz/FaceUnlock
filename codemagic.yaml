workflows:
  faceunlock-android: { name: "FaceUnlock Android (legacy toolchain)", max_build_duration: 60, instance_type: "linux_x2", environment: { java: 8 }, scripts: [ { name: "Make gradlew executable", script: "chmod +x ./gradlew" }, { name: "Install legacy Android SDK platform and build-tools", script: "yes | sdkmanager --licenses > /dev/null || true; sdkmanager \"platforms;android-26\" \"build-tools;26.0.2\" > /dev/null || true" }, { name: "Build debug APK", script: "./gradlew assembleDebug --stacktrace --no-daemon" } ], artifacts: [ "app/build/outputs/**/*.apk", "app/build/outputs/**/mapping.txt" ] }
